# ============================================================================
# 任务12 · Nginx：托管前端静态产物 + 反向代理 /api 到 FastAPI
#
# 挂载位置：/etc/nginx/conf.d/zq.conf（见 docker/frontend.Dockerfile）
# 关键点：
#   · 前端用的是 hash 路由（/#/job/J0020），地址栏的 # 之后不会发给服务器，
#     所以服务端只需要正确返回 index.html，不需要任何 history fallback 规则；
#     下面 location / 的 try_files 仍然保留，为将来切换 history 路由留路。
#   · /api/ 反代到 compose 内网服务名 api:8000 —— api 容器不对外暴露端口，
#     公网唯一入口就是这里的 80。
# ============================================================================

upstream zq_api {
    server api:8000;
    keepalive 16;                 # 与后端保持长连接，省掉每次请求的 TCP 握手
}

server {
    listen 80 default_server;
    server_name _;

    # 上传简历 PDF 用。FastAPI 侧校验上限 10MB，这里留一点余量
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # 中文不乱码
    charset utf-8;

    # ---------------- 压缩：前端 JS 未压缩约 870KB，压缩后约 1/4 ----------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # ---------------- 带内容指纹的静态资源：一年强缓存 ----------------
    # Vite 产物文件名里已含 hash（如 index-Bwa5OhyB.js），内容变了文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------- 接口：反向代理到后端容器 ----------------
    location /api/ {
        proxy_pass http://zq_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent 智能问答要真实调用 DeepSeek（工具多轮，实测 7~15s），超时必须给足；
        # 其余接口都在 1s 内，这里取"最慢的那个"作为统一上限
        proxy_connect_timeout 10s;
        proxy_send_timeout   180s;
        proxy_read_timeout   180s;

        # 关掉响应缓冲：让浏览器尽快拿到首字节（问答是流式体验的关键）
        proxy_buffering off;
    }

    # ---------------- Swagger 交互文档（演示与验收用） ----------------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://zq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------------- 前端入口 ----------------
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 绝不能缓存，否则前端发新版后用户会一直拿到旧壳子
        add_header Cache-Control "no-cache";
    }
}
