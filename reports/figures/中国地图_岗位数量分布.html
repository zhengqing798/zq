<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国各省份岗位数量分布</title>
    <!-- 引入 ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; background: #f5f7fa;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-family: "Microsoft YaHei", sans-serif;
        }
        h2 { color: #333; margin-bottom: 8px; }
        p.sub { color: #666; font-size: 13px; margin-bottom: 12px; }
        #map-container {
            width: 90%; height: 85%; background: #fff;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <h2>中国各省份岗位数量分布</h2>
    <p class="sub">数据来源：data/processed/zhaopin_jobs_cleaned.csv（清洗后 8836 条岗位）｜ 统计字段：岗位地区 ｜ 颜色越深岗位数越多，无数据省份记为 0</p>
    <div id="map-container"></div>

    <script>
        const myChart = echarts.init(document.getElementById('map-container'));

        // 各省岗位数量（按"岗位地区"字段汇总，无数据为 0）
        const mapData = [
            { name: '北京市', value: 0 },
            { name: '天津市', value: 0 },
            { name: '河北省', value: 0 },
            { name: '山西省', value: 0 },
            { name: '内蒙古自治区', value: 0 },
            { name: '辽宁省', value: 0 },
            { name: '吉林省', value: 0 },
            { name: '黑龙江省', value: 0 },
            { name: '上海市', value: 0 },
            { name: '江苏省', value: 2073 },
            { name: '浙江省', value: 2656 },
            { name: '安徽省', value: 554 },
            { name: '福建省', value: 3553 },
            { name: '江西省', value: 0 },
            { name: '山东省', value: 0 },
            { name: '河南省', value: 0 },
            { name: '湖北省', value: 0 },
            { name: '湖南省', value: 0 },
            { name: '广东省', value: 0 },
            { name: '广西壮族自治区', value: 0 },
            { name: '海南省', value: 0 },
            { name: '重庆市', value: 0 },
            { name: '四川省', value: 0 },
            { name: '贵州省', value: 0 },
            { name: '云南省', value: 0 },
            { name: '西藏自治区', value: 0 },
            { name: '陕西省', value: 0 },
            { name: '甘肃省', value: 0 },
            { name: '青海省', value: 0 },
            { name: '宁夏回族自治区', value: 0 },
            { name: '新疆维吾尔自治区', value: 0 },
            { name: '台湾省', value: 0 },
            { name: '香港特别行政区', value: 0 },
            { name: '澳门特别行政区', value: 0 }
        ];

        const maxValue = 3553;

        fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
            .then(response => response.json())
            .then(chinaJson => {
                echarts.registerMap('china', chinaJson);

                const option = {
                    tooltip: {
                        trigger: 'item',
                        formatter: function(params) {
                            const v = (params.value === undefined || params.value === null) ? 0 : params.value;
                            const pct = (v / 8836 * 100).toFixed(2);
                            return `${params.name}<br/>岗位数量：${v}<br/>占比：${pct}%`;
                        }
                    },
                    visualMap: {
                        min: 0,
                        max: maxValue,
                        left: 'left',
                        bottom: '5%',
                        text: ['多', '少'],
                        calculable: true,
                        inRange: { color: ["#f7fbff", "#deebf7", "#c6dbef", "#9ecae1", "#6baed6", "#3182bd"] }
                    },
                    series: [
                        {
                            name: '岗位数量',
                            type: 'map',
                            map: 'china',
                            roam: true,
                            label: {
                                show: true,
                                fontSize: 8,
                                color: '#333',
                                formatter: function(params) {
                                    const v = (params.value === undefined || params.value === null) ? 0 : params.value;
                                    return `${params.name}\n${v}`;
                                }
                            },
                            itemStyle: {
                                borderWidth: 0.5,
                                borderColor: '#ffffff',
                                areaColor: '#f7fbff'
                            },
                            emphasis: {
                                label: { color: '#fff', fontSize: 12 },
                                itemStyle: { areaColor: '#f46d43' }
                            },
                            data: mapData
                        }
                    ]
                };

                myChart.setOption(option);
            })
            .catch(function(err) {
                document.getElementById('map-container').innerHTML =
                    '<p style="padding:40px;color:#c00">地图 GeoJSON 加载失败（需要联网访问 geo.datav.aliyun.com）：' + err + '</p>';
            });

        window.addEventListener('resize', () => { myChart.resize(); });
    </script>
</body>
</html>
