<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>06_招聘活跃企业TOP榜_横向柱状图.html</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

<style>
  html,body{margin:0;padding:0;background:#ffffff;overflow:hidden;
            font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  #chart{width:1300px;height:900px;}
</style>
</head>
<body>
<div id="chart"></div>
<script>
  var chart = echarts.init(document.getElementById('chart'), null, {devicePixelRatio: 2});
  var option = 
  {
    title: {
      text: '招聘活跃企业 TOP20',
      subtext: '数据源：处理后数据 8836 条岗位的"公司名称"字段（共 4096 家企业）｜按在招岗位数排名',
      left: 'center', top: 12,
      textStyle: {fontSize: 22, fontWeight: 'bold'},
      subtextStyle: {fontSize: 12, color: '#777'}
    },
    tooltip: {
      trigger: 'axis', axisPointer: {type: 'shadow'},
      formatter: function(ps) {
        return ps[0].name + '<br/>在招岗位：' + ps[0].value + ' 个（占全部岗位 '
             + (ps[0].value / 8836 * 100).toFixed(2) + '%）';
      }
    },
    grid: {left: 260, right: 90, top: 110, bottom: 50},
    xAxis: {type: 'value', name: '在招岗位数', nameTextStyle: {fontSize: 12},
            axisLabel: {fontSize: 12},
            splitLine: {lineStyle: {type: 'dashed', color: '#e8e8e8'}}},
    yAxis: {type: 'category', data: ["中汽新能电池科技有限公司", "日善电脑配件(嘉善)有限公司", "天阳科技", "浙江莱宝显示科技有限公司", "福建圣农集团", "宁德时代新能源科技股份有限公司", "厦门至恒融兴信息技术股份有限公司", "科锐尔人力资源服务(苏州)有限公司", "福州云之景科技有限公司", "厦门海辰储能科技股份有限公司", "京北方", "厦门亿联网络技术股份有限公司", "中电福富信息科技有限公司", "新大陆支付", "鑫锡软件(朝阳)有限公司", "宁波信泰机械有限公司", "厦门睿云联创新科技股份有限公司", "外企德科数字技术有限公司", "三一集团有限公司", "软通动力信息技术(集团)股份有限公司"],
            axisLabel: {fontSize: 12, width: 240, overflow: 'truncate'},
            axisTick: {show: false}},
    series: [{
      name: '在招岗位数', type: 'bar', barMaxWidth: 22,
      data: [21, 21, 22, 23, 23, 23, 23, 23, 24, 24, 24, 25, 26, 27, 27, 29, 33, 36, 72, 86],
      itemStyle: {
        borderRadius: [0, 4, 4, 0],
        color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          {offset: 0, color: '#9ecae1'}, {offset: 1, color: '#2171b5'}])
      },
      label: {show: true, position: 'right', fontSize: 12, formatter: '{c} 个'}
    }]
  }
;
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
</script>
</body>
</html>
