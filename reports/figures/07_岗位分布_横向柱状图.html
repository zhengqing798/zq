<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>07_岗位分布_横向柱状图.html</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>

<style>
  html,body{margin:0;padding:0;background:#ffffff;overflow:hidden;
            font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
  #chart{width:1500px;height:900px;}
</style>
</head>
<body>
<div id="chart"></div>
<script>
  var chart = echarts.init(document.getElementById('chart'), null, {devicePixelRatio: 2});
  var option = 
  {
    title: {
      text: '岗位分布（按岗位大类 + 高频岗位）',
      subtext: '数据源：处理后数据 8836 条岗位｜原始岗位名称 6037 种（5196 种仅出现 1 次），按关键词归并为 18 个岗位大类',
      left: 'center', top: 12,
      textStyle: {fontSize: 22, fontWeight: 'bold'},
      subtextStyle: {fontSize: 12, color: '#777'}
    },
    tooltip: {trigger: 'axis', axisPointer: {type: 'shadow'},
      formatter: function(ps) {
        var i = ps[0].dataIndex;
        if (ps[0].seriesIndex === 0) {
          return '<b>' + ps[0].name + '</b><br/>岗位数：' + ps[0].value + '（'
               + (ps[0].value / 8836 * 100).toFixed(2) + '%）<br/>高频岗位：' + ["医药代表（3）、生物信息工程师（2）、医药代表（福建）（1）", "物联网应用技术专业骨干教师（1）、供应链 专任教师（1）、少儿编程教师（1）", "模拟版图设计工程师（2）、IC设计工程师（1）、方案设计师（1）", "外访催收主管（3）、证券投资顾问（3）、风控专员（2）", "项目经理（8）、产品经理（8）、产品专员（4）", "前端开发工程师（23）、web前端工程师（6）、前端开发（4）", "仓库主管（9）、采购专员（8）、采购经理（8）", "成本会计（19）、会计（16）、主办会计（8）", "HRBP（9）、总经理助理（7）、业务助理（6）", "数据分析师（18）、统计员（9）、生产统计员（9）", "算法工程师（33）、机器视觉工程师（17）、图像算法工程师（12）", "新媒体运营（26）、跨境电商运营（21）、销售助理（19）", "测试工程师（67）、软件测试工程师（33）、硬件测试工程师（25）", "电气工程师（22）、工艺工程师（18）、生产文员（13）", "技术经理（3）、报告专员（3）、巡检员（3）", "运维工程师（36）、IT工程师（13）、网络工程师（13）", "软件工程师（54）、嵌入式软件工程师（53）、java开发工程师（35）", "质量工程师（152）、质量经理（62）、品质工程师（52）"][i];
        }
        return '<b>' + ps[0].name + '</b><br/>岗位数：' + ps[0].value + '（'
             + (ps[0].value / 8836 * 100).toFixed(2) + '%）';
      }
    },
    grid: [{left: 150, right: 90, top: 110, bottom: 60, width: '42%'},
           {left: '58%', right: 70, top: 110, bottom: 60}],
    xAxis: [
      {type: 'value', gridIndex: 0, name: '岗位数', nameTextStyle: {fontSize: 11},
       axisLabel: {fontSize: 11}, splitLine: {lineStyle: {type: 'dashed', color: '#e8e8e8'}}},
      {type: 'value', gridIndex: 1, name: '岗位数', nameTextStyle: {fontSize: 11},
       axisLabel: {fontSize: 11}, splitLine: {lineStyle: {type: 'dashed', color: '#e8e8e8'}}}
    ],
    yAxis: [
      {type: 'category', gridIndex: 0, data: ["医药生物类", "教育与培训类", "设计类", "金融与风控类", "产品与项目类", "前端与移动端类", "供应链与物流类", "财务类", "人事行政类", "数据分析类", "算法与人工智能类", "运营与市场类", "测试类", "硬件与制造类", "其他", "运维与支持类", "软件开发类", "质量管理类"],
       axisLabel: {fontSize: 12}, axisTick: {show: false}},
      {type: 'category', gridIndex: 1, data: ["品质主管", "品质经理", "质量主管", "品质工程师", "嵌入式软件工程师", "软件工程师", "质量经理", "测试工程师", "java开发工程师", "质量工程师"],
       axisLabel: {fontSize: 11, width: 150, overflow: 'truncate'}, axisTick: {show: false}}
    ],
    series: [
      {name: '岗位大类', type: 'bar', xAxisIndex: 0, yAxisIndex: 0, barMaxWidth: 22,
       data: [14, 19, 30, 42, 85, 139, 159, 183, 280, 386, 611, 628, 628, 794, 916, 1080, 1235, 1607],
       itemStyle: {borderRadius: [0, 4, 4, 0],
         color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
           {offset: 0, color: '#9ecae1'}, {offset: 1, color: '#2171b5'}])},
       label: {show: true, position: 'right', fontSize: 11,
               formatter: function(p) { return p.value + '（' + (p.value / 8836 * 100).toFixed(1) + '%）'; }}},
      {name: '高频岗位名称', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, barMaxWidth: 16,
       data: [37, 43, 49, 52, 53, 54, 62, 67, 74, 152],
       itemStyle: {borderRadius: [0, 4, 4, 0],
         color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
           {offset: 0, color: '#ffd591'}, {offset: 1, color: '#fa8c16'}])},
       label: {show: true, position: 'right', fontSize: 11, formatter: '{c}'}}
    ]
  }
;
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
</script>
</body>
</html>
